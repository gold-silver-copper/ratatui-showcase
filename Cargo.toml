[package]
name = "ratatui-showcase"
version = "0.1.0"
edition = "2024"
description = "A fullscreen ratatui showcase for big monitors and projectors"
license = "MIT"
repository = "https://github.com/gold-silver-copper/ratatui-showcase"

[dependencies]
ab_glyph = "0.2.32"
bevy = { version = "0.20.0", default-features = false, features = ["async_executor", "bevy_asset", "bevy_image", "bevy_render", "bevy_shader", "bevy_window", "multi_threaded", "std"] }
bevy_ratatui = "0.13.0"
bytemuck = "1.25.2"
fastrand = "2.5.0"
font8x8 = "0.3.1"
fontdb = "0.24.0"
naga = { version = "30.0.1", features = ["wgsl-in", "spv-out"] }
ratatui = "0.30.2"
tachyonfx = { version = "0.25.2", features = ["sendable"] }
wgpu = { version = "30.0.1", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The same lints as fux (gold-silver-copper/fux), at the same levels.
[lints.rust]
unused_must_use = "forbid"
unconditional_recursion = "forbid"
unsafe_code = "forbid"

[lints.clippy]
suspicious = { level = "forbid", priority = -1 }
print_stdout = "forbid"
print_stderr = "deny"
dbg_macro = "forbid"
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
unreachable = "forbid"
todo = "forbid"
unimplemented = "forbid"
indexing_slicing = "forbid"
exit = "forbid"
infinite_loop = "forbid"
large_stack_frames = "forbid"
unchecked_time_subtraction = "forbid"
read_zero_byte_vec = "forbid"
unused_result_ok = "forbid"
debug_assert_with_mut_call = "forbid"
allow_attributes = "forbid"
undocumented_unsafe_blocks = "forbid"
significant_drop_in_scrutinee = "forbid"
significant_drop_tightening = "forbid"
cast_lossless = "forbid"
string_slice = "forbid"
mem_forget = "forbid"
large_stack_arrays = "forbid"
allow_attributes_without_reason = "forbid"
wildcard_enum_match_arm = "forbid"
cast_possible_truncation = "forbid"
cast_possible_wrap = "forbid"
cast_sign_loss = "forbid"
arithmetic_side_effects = "forbid"
disallowed_methods = "forbid"

